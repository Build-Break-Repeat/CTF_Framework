<!DOCTYPE html>
<html>

<head>
    <title>Configure Event - Build Break Repeat</title>

    <link rel="stylesheet" href="../css/UIconfig.css">
    <script src="../js/UIbehavior.js"></script>
</head>

<body>

<header>
    <div class="header-shell">
        <div class="brand-block">
            <h1>Build Break Repeat</h1>
        </div>

        <nav>
            <a href="../index.html">Dashboard</a>
            <a class="active" href="register.html">Configure Event</a>
            <a href="challenges.html">Review Challenges</a>
            <a href="instructions.html">Deployment Guide</a>
        </nav>
    </div>
</header>

<main>
    <section class="setup-section">
        <h2>Configure Event</h2>
        <form id="setup-form" class="setup-form">
            <div class="field-grid setup-fields">
                <label class="field" for="eventName">
                    <span>Event name</span>
                    <input type="text" id="eventName" name="eventName" placeholder="Spring 2026 Networking Lab">
                </label>

                <label class="field" for="teamCount">
                    <span>Number of teams</span>
                    <input type="number" id="teamCount" name="teamCount" min="1">
                </label>

                <label class="field" for="eventLength">
                    <span>Planned event length (minutes)</span>
                    <input type="number" id="eventLength" name="eventLength" min="30" step="15">
                </label>
            </div>

            <div class="setup-group">
                <h3>Challenge categories</h3>
                <label class="field" for="challengeSelection">
                    <span>Select CTF Environment</span>
                    <select id="challengeSelection" name="challengeSelection" class="challenge-selection" multiple size="7">
                        <option value="dvwa">Damn Vulnerable Web Application</option>
                        <option value="juice-shop">OWASP Juice Shop</option>
                        <option value="webgoat">WebGoat</option>
                        <option value="sqli">SQL Injection Lab</option>
                        <option value="nowasp">NoWASP</option>
                        <option value="bwapp">BWAPP</option>
                        <option value="metasploitable">Metasploitable</option>
                    </select>
                </label>
                <div class="button-row">
                    <a class="button secondary" href="challenges.html">Don't know what to pick? Click Here for more Challenge info</a>
                </div>
            </div>

            <div class="setup-group">
                <h3>Flag assignment</h3>
                <div class="check-grid setup-categories">
                    <label class="check-card">
                        <input type="radio" name="flagMode" value="unique" checked>
                        <span><strong>(Per Team Flags)</strong> Generate separate flags for each team to complete.</span>
                    </label>
                    <label class="check-card">
                        <input type="radio" name="flagMode" value="shared">
                        <span><strong>(Shared Flags)</strong> Generate flags to be completed by any team.</span>
                    </label>
                </div>
            </div>

            <div class="button-row">
                <button type="submit">Complete Setup</button>
            </div>
        </form>
    </section>
</main>
</body>

</html>
