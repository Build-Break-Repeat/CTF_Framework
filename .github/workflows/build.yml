name: Build ctfctl

on:
  push:
    branches: [ "master" ]
    paths:
      - "cmd/ctfctl/**"
      - "go.mod"

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep -oP '(?<=const version = ")[\d.]+' cmd/ctfctl/main.go)
        echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build Linux binary
      run: GOOS=linux GOARCH=amd64 go build -o ctfctl ./cmd/ctfctl

    - name: Commit binary
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f ctfctl
        if git diff --cached --quiet; then
          echo "No changes to ctfctl binary, skipping commit."
        else
          git commit -m "ci: build ctfctl binary [skip ci]"
          git pull --rebase
          git push
        fi