name: Build ctfctl

on:
  push:
    branches: [ "master" ]
    paths:
      - "cmd/ctfctl/**"
      - "go.mod"

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep -oP '(?<=const version = ")[\d.]+' cmd/ctfctl/main.go)
        echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build Linux binary
      run: GOOS=linux GOARCH=amd64 go build -o ctfctl ./cmd/ctfctl

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ctfctl ${{ steps.version.outputs.version }}
        files: ctfctl
